<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF.js 文件上传示例</title>

      <script src="./public/ip.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #ip-display {
        font-size: 1.2em;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>室内乐重奏总谱翻谱工具</h1>
    <p id="ip-display">Loading IP address...</p>

    <!-- <input type="file" id="pdf-file" accept="application/pdf">
  <input type="file" id="pdf-file" name="pdf-file" accept="application/pdf">

  <button type="button" onclick="uploadFile()">确认</button>   -->

    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" id="pdf-file" name="pdf-file" />
      <button type="button" onclick="uploadFile()">上传</button>
    </form>
    <div id="upload-status"></div>

    <script>
      console.log("ipAddress:", ipAddress);

      var globalVariable = localStorage.getItem("myGlobalVariable");

      if (!globalVariable) {
        // 如果变量不存在，则设置它的初始值
        globalVariable = "初始值";
        localStorage.setItem("myGlobalVariable", globalVariable);
      }

      var myLink = document.createElement("a");
      myLink.href = globalVariable;
      myLink.textContent = "上传成功，查看地址: " + globalVariable;
      var myDiv = document.getElementById("upload-status");
      myDiv.appendChild(myLink);

      function uploadFile() {
        // 获取文件输入元素和上传状态元素
        var fileInput = document.getElementById("pdf-file");
        var uploadStatus = document.getElementById("upload-status");

        // 检查是否有文件被选中
        if (fileInput.files && fileInput.files[0]) {
          // 创建FormData对象
          var formData = new FormData();

          // 将文件添加到FormData对象中
          formData.append("pdfFile", fileInput.files[0]);

          // 初始化XMLHttpRequest对象
          var xhr = new XMLHttpRequest();
          console.log("ipAddress in upload:", ipAddress);

          // 设置请求类型和URL
          xhr.open("POST", "http://" + ipAddress + ":5000/upload", true);

          // 设置请求完成后的处理函数
          xhr.onloadend = function () {
            if (xhr.status === 200) {
              // 请求成功，服务器返回了响应
              var response = JSON.parse(xhr.responseText);
              // 假设服务器返回了包含UUID的JSON对象
              if (response && response.uuid) {
                uploadStatus.textContent = '上传成功，UUID: ' + response.uuid;
                globalVariable =
                  // "http://" +ipAddress +
                  // ":8080/
                  "view.html?file=" +response.uuid;
                localStorage.setItem("myGlobalVariable", globalVariable);
              } else {
                uploadStatus.textContent = "上传成功，但未收到UUID。";
              }
            } else {
              // 请求失败
              uploadStatus.textContent = "上传失败，状态码：" + xhr.status;
            }
          };

          // 设置请求错误的处理函数
          xhr.onerror = function () {
            uploadStatus.textContent = "上传发生错误。";
          };

          // 发送请求
          xhr.send(formData);
        } else {
          // 如果没有文件被选中，给出提示
          uploadStatus.textContent = "请选择一个文件。";
        }
        return false;
      }
    </script>
  </body>
</html>
