<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF.js 文件上传示例</title>
    <script src="./pdfjs-dist/build/pdf.mjs" type="module"></script>
    <script src="./public/ip.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- <h1>PDF Viewer</h1> -->
    <p id="server-info">Loading configuration...</p>

    <img src="public/442.jpg" alt="logo图" class="right-top-image" />
    <span
    >Page: <span id="page_num"></span> / <span id="page_count"></span
  ></span>
    <div class="container">
      <canvas
        id="the-canvas"
        style="border: 1px solid black; direction: ltr"
      ></canvas>
    </div>
    <div class="button-container">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>


    <script id="script" type="module">
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "./pdfjs-dist/build/pdf.worker.mjs";

      // 键盘事件监听
      document.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowLeft') {
          document.getElementById('prev').click();
        } else if (event.key === 'ArrowRight') {
          document.getElementById('next').click();
        }
      });

      // 触摸事件相关变量
      let touchStartX = 0;
      let touchEndX = 0;
      const minSwipeDistance = 50; // 最小滑动距离，单位像素

      // 监听触摸开始事件
      document.addEventListener('touchstart', function(event) {
        touchStartX = event.touches[0].clientX;
      });

      // 监听触摸结束事件
      document.addEventListener('touchend', function(event) {
        touchEndX = event.changedTouches[0].clientX;
        handleSwipe();
      });

      // 处理滑动
      function handleSwipe() {
        const swipeDistance = touchEndX - touchStartX;
        
        if (Math.abs(swipeDistance) >= minSwipeDistance) {
          if (swipeDistance > 0) {
            // 向右滑动，显示上一页
            document.getElementById('prev').click();
          } else {
            // 向左滑动，显示下一页
            document.getElementById('next').click();
          }
        }
      }
    </script>

    <script type="module">
      // 页面加载前调用

      var pdfDoc = null,
        pageNum = 1,
        pageRendering = false,
        pageNumPending = null,
        scale = 0.8,
        canvas = document.getElementById("the-canvas"),
        ctx = canvas.getContext("2d");
  
      console.log("ipAddress from js:", ipAddress);
      const ws = new WebSocket("ws://" + ipAddress + ":8765");

      ws.onopen = function (event) {
        console.log("Connection opened");
      };

      ws.onmessage = function (event) {
        console.log("Received message:", event.data);
        queueRenderPage(event.data);
        // alert('hello received from server!');
      };

      ws.onclose = function (event) {
        console.log("Connection closed");
      };

      ws.onerror = function (error) {
        console.error("WebSocket Error:", error);
      };

      function sendMessage() {
        ws.send("hello"); // 发送任意消息，服务器将回复"hello"
      }

      function queueRenderPage(num) {
        num = Number(num);
        console.log("renderpage:", num, typeof num);
        if (pageRendering) {
          pageNumPending = num;
        } else {
          renderPage(num);
        }
      }

      /**
       * Displays previous page.
       */
      function onPrevPage() {
        if (pageNum <= 1) {
          return;
        }
        pageNum--;
        queueRenderPage(pageNum);
        ws.send(pageNum);
      }

      /**
       * Displays next page.
       */
      function onNextPage() {
        if (pageNum >= pdfDoc.numPages) {
          return;
        }
        pageNum++;
        queueRenderPage(pageNum);
        ws.send(pageNum);
      }

      document.getElementById("prev").addEventListener("click", onPrevPage);

      document.getElementById("next").addEventListener("click", onNextPage);
      var xhr = new XMLHttpRequest();
      var url = window.location.search;
      // 解析 URL
      var params = new URLSearchParams(url);

      // 获取参数值
      var pdfUrl = params.get("file");

      // 输出参数值
      console.log(pdfUrl); // 输出: value1
      var fetch_url = "http://" + ipAddress + ":5000/view/" + pdfUrl;

      var loadingTask = pdfjsLib.getDocument(fetch_url);

      pdfDoc = await loadingTask.promise;

      function renderPage(num) {
        pageRendering = true;
        // Using promise to fetch the page
        pdfDoc.getPage(num).then(function (page) {
          var viewport = page.getViewport({ scale: scale });
          // Support HiDPI-screens.
          var outputScale = window.devicePixelRatio || 1;
          console.log("outputScale:", outputScale);
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";

          var transform =
            outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

          // Render PDF page into canvas context
          var renderContext = {
            canvasContext: ctx,
            transform: transform,
            viewport: viewport,
          };
          var renderTask = page.render(renderContext);

          // Wait for rendering to finish
          renderTask.promise.then(function () {
            pageRendering = false;
            if (pageNumPending !== null) {
              // New page rendering is pending
              renderPage(pageNumPending);
              pageNumPending = null;
            }
          });
        });

        // Update page counters
        document.getElementById("page_num").textContent = num;
      }

      // 调用 loadPdf 函数
      document.getElementById("page_count").textContent = pdfDoc.numPages;
      renderPage(pageNum);
    </script>
  </body>
</html>
